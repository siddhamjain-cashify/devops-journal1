name: CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "notes/**"

  pull_request:
    paths-ignore:
      - "notes/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hello-api

jobs:

  # ========================================
  # LINT
  # ========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 app.py test_app.py


  # ========================================
  # TEST
  # ========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    needs: lint

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: |
          pytest


  # ========================================
  # BUILD & PUSH
  # ========================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    permissions:
      contents: read
      id-token: write

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # AWS OIDC
      # ----------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------
      # Verify AWS Identity
      # ----------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity


      # ----------------------------------------
      # Login to ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------
      # Set Image Variables
      # ----------------------------------------
      - name: Set Image Variables
        run: |
          echo "SHA_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

          echo "IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_ENV"

          echo "Image URI:"
          echo "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}"

          echo "SHA Tag:"
          echo "${GITHUB_SHA::7}"


      # ----------------------------------------
      # Docker Buildx
      # ----------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------
      # Build Docker Image
      # ----------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false

          tags: |
            ${{ env.IMAGE_URI }}:${{ env.SHA_TAG }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ----------------------------------------
      # Push Immutable SHA Tag
      # ----------------------------------------
      - name: Push SHA Tag
        run: |
          docker push "${{ env.IMAGE_URI }}:${{ env.SHA_TAG }}"


      # ----------------------------------------
      # Verify Image in ECR
      # ----------------------------------------
      - name: Show Image Details
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "imageDetails[*].{Digest:imageDigest,Tags:imageTags}" \
            --output table
